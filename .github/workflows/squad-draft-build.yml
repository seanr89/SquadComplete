name: Build squad-draft

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'squad-draft/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'squad-draft/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: squad-draft/package-lock.json

    - name: Install dependencies
      working-directory: ./squad-draft
      run: npm ci

    - name: Build
      working-directory: ./squad-draft
      run: npm run build
