name: Build squad-api

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'squad-api/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'squad-api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore squad-api/squad-api.csproj

    - name: Build
      run: dotnet build squad-api/squad-api.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test squad-api/squad-api.csproj --no-build --configuration Release --verbosity normal
